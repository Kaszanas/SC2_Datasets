name: Test PyPI Installation

on:
    workflow_dispatch:

jobs:
    docs:
        runs-on: ubuntu-latest

        steps:
            - name: Check-out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

            - name: Install packages
              run: uv sync

            - name: Build documentation
              run: uv run make html --directory docs/

    test-pypi:
        # Set up operating system
        runs-on: ubuntu-latest
        needs: docs

        permissions:
            id-token: write

        # Define job steps
        steps:
            - name: Check-out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

            - name: Install packages
              run: uv sync

            # Building the package:
            - name: Build dist with uv
              run: uv build

            # Publishing to TestPyPI:
            - name: Publish to TestPyPI
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
              with:
                  user: __token__
                  repository-url: https://test.pypi.org/legacy/
                  verbose: true

    install-pypi-underscore:
        runs-on: ubuntu-latest
        needs:
            - test-pypi
            - docs

        steps:
            # Configuring and attempting to install from TestPyPI
            - name: Test install from TestPyPI underscore
              run: |
                  pip install \
                  --index-url https://test.pypi.org/simple/ \
                  --extra-index-url https://pypi.org/simple \
                  sc2_datasets
    install-pypi-dash:
        runs-on: ubuntu-latest
        needs:
            - test-pypi
            - docs

        steps:
            # Configuring and attempting to install from TestPyPI
            - name: Test install from TestPyPI dash
              run: |
                  pip install \
                  --index-url https://test.pypi.org/simple/ \
                  --extra-index-url https://pypi.org/simple \
                  sc2-datasets
