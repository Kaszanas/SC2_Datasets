name: Test PyPI Installation

on:
    workflow_dispatch:

jobs:
    docs:
        runs-on: ubuntu-latest

        steps:
            - name: Check-out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

            - name: Install packages
              run: uv sync

            - name: Build documentation
              run: uv run make html --directory docs/

    test-pypi:
        # Set up operating system
        runs-on: ubuntu-latest
        needs: docs

        permissions:
            id-token: write

        # Define job steps
        steps:
            - name: Check-out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

            - name: Install packages
              run: uv sync

            # Building the package:
            - name: Build dist with uv
              run: uv build

            # Publishing to TestPyPI:
            - name: Publish to TestPyPI
              uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
              with:
                  user: __token__
                  repository-url: https://test.pypi.org/legacy/
                  verbose: true

    install-pypi-underscore:
        runs-on: ubuntu-latest
        needs:
            - test-pypi
            - docs

        steps:
            # Configuring and attempting to install from TestPyPI
            - name: Test install from TestPyPI underscore
              run: |
                  pip install \
                  --index-url https://test.pypi.org/simple/ \
                  --extra-index-url https://pypi.org/simple \
                  sc2_datasets
    install-pypi-dash:
        runs-on: ubuntu-latest
        needs:
            - test-pypi
            - docs

        steps:
            # Configuring and attempting to install from TestPyPI
            - name: Test install from TestPyPI dash
              run: |
                  pip install \
                  --index-url https://test.pypi.org/simple/ \
                  --extra-index-url https://pypi.org/simple \
                  sc2-datasets
