[project]
name = "latent-trainer"
version = "2.1.0"
description = "Library providing PyTorch and PyTorch Lightning API for pre-processed StarCraft II dataset SC2EGSetDataset and other datasets."
readme = "README.md"
authors = [{"name" = "Andrzej Białecki"}, {"name" = "Andrzej Szczap"}]
license = "GNU General Public License v3.0"
requires-python = ">=3.11"
dependencies = [
    "lightning>=2.6.1",
    "pandas>=3.0.1",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "furo>=2025.12.19",
    "myst-nb>=1.4.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
    "sphinx-autoapi>=3.8.0",
]



[tool.commitizen]
version = "2.1.0"
version_files = ["pyproject.toml:version"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["I"]

[tool.pytest.ini_options]
markers = [
    "minor: marks tests as minor (deselect with '-m \"not minor\"')",
    "major",
]
