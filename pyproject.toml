[tool.poetry]
name = "sc2_datasets"
version = "2.1.0"
description = "Library providing PyTorch and PyTorch Lightning API for pre-processed StarCraft II dataset SC2EGSetDataset and other datasets."
authors = ["Andrzej Białecki", "Andrzej Szczap"]
license = "GNU General Public License v3.0"
readme = "README.md"

[tool.commitizen]
version = "2.1.0"
version_files = ["pyproject.toml:version"]

[tool.poetry.dependencies]
python = "^3.11"
pytorch-lightning = "^2.5.0"
pandas = "^2.2.3"
tqdm = "^4.67.1"
requests = "^2.32.3"
ijson = "^3.4.0.post0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-cov = "^7.0.0"
myst-nb = "^1.2.0"
sphinx-autoapi = "^3.6.0"
furo = "^2025.9.25"
pre-commit = "^4.2.0"
ruff = "^0.14.7"
commitizen = "^4.6.0"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["I"]


[tool.pytest.ini_options]
markers = [
    "minor: marks tests as minor (deselect with '-m \"not minor\"')",
    "major",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
